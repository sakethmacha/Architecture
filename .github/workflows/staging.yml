name: Deploy to Production

on:
  push:
    branches:
      - develop   # your production branch

env:
  DOTNET_VERSION: '9.0.x'
  AZURE_WEBAPP_NAME: 'myapp-staging'
  PROJECT_PATH: './WebApp.Web/WebApp.Web.csproj'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1 - Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2 - Setup .NET
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Step 3 - Clean previous builds (IMPORTANT)
      - name: Clean Solution
        run: dotnet clean

      # Step 4 - Restore dependencies
      - name: Restore Dependencies
        run: dotnet restore WebApplicationDDD.sln

      # Step 5 - Publish (build + publish fresh)
      - name: Publish Web Project
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --output ./publish

      # Step 6 - Verify published files (DEBUG - optional)
      - name: Check Published Files
        run: ls -R ./publish

      # Step 7 - Deploy to Azure (FORCE CLEAN)
      - name: Deploy to Azure Production
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION }}
          package: ./publish
          clean: true
