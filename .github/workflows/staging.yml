name: Deploy to Staging

on:
  push:
    branches:
      - develop

env:
  DOTNET_VERSION: '9.0.x'
  AZURE_WEBAPP_NAME: 'myapp-staging'
  PROJECT_PATH: './WebApp.Web/WebApp.Web.csproj'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1 - Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2 - Setup .NET
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Step 3 - Clean previous builds
      - name: Clean Solution
        run: dotnet clean WebApplicationDDD.sln   # ✅ Added solution name

      # Step 4 - Restore dependencies
      - name: Restore Dependencies
        run: dotnet restore WebApplicationDDD.sln

      # Step 5 - Build solution        ✅ Added missing build step
      - name: Build Solution
        run: dotnet build WebApplicationDDD.sln --configuration Release --no-restore

      # Step 6 - Publish Web project
      - name: Publish Web Project
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-restore --output ./publish

      # Step 7 - Verify published files
      - name: Check Published Files
        run: ls -R ./publish

      # Step 8 - Deploy to Azure Staging
      - name: Deploy to Azure Staging
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
          package: ./publish
          clean: true
