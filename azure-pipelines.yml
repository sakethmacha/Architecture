trigger:
  branches:
    include:
      - main

pool:
  name: 'pool'

variables:
  buildConfiguration: 'Release'
  solution: '**/*.sln'
  keyVaultName: 'keyvault1232123'

stages:

# =========================
# BUILD STAGE
# =========================
- stage: Build
  displayName: 'Build & Test'
  jobs:
    - job: BuildJob
      displayName: 'Build, Test, Publish'
      steps:

        - task: NuGetAuthenticate@1
          displayName: 'Authenticate NuGet'

        - task: DotNetCoreCLI@2
          displayName: 'Restore NuGet packages'
          inputs:
            command: 'restore'
            projects: '$(solution)'
            feedsToUse: 'select'

        - task: DotNetCoreCLI@2
          displayName: 'Build WebApp.Domain'
          inputs:
            command: 'build'
            projects: '**/WebApp.Domain/*.csproj'
            arguments: '--configuration $(buildConfiguration) --no-restore'

        - task: DotNetCoreCLI@2
          displayName: 'Build WebApp.Application'
          inputs:
            command: 'build'
            projects: '**/WebApp.Application/*.csproj'
            arguments: '--configuration $(buildConfiguration) --no-restore'

        - task: DotNetCoreCLI@2
          displayName: 'Build WebApp.Infrastructure'
          inputs:
            command: 'build'
            projects: '**/WebApp.Infrastructure/*.csproj'
            arguments: '--configuration $(buildConfiguration) --no-restore'

        - task: DotNetCoreCLI@2
          displayName: 'Build WebApp.Web'
          inputs:
            command: 'build'
            projects: '**/WebApp.Web/*.csproj'
            arguments: '--configuration $(buildConfiguration) --no-restore'

        - task: DotNetCoreCLI@2
          displayName: 'Publish WebApp.Web'
          inputs:
            command: 'publish'
            projects: '**/WebApp.Web/*.csproj'
            arguments: >-
              --configuration $(buildConfiguration)
              --output $(Build.ArtifactStagingDirectory)
              --no-build
            zipAfterPublish: true

        - task: PublishBuildArtifacts@1
          displayName: 'Upload artifact'
          inputs:
            pathToPublish: '$(Build.ArtifactStagingDirectory)'
            artifactName: 'WebApplicationDDD'


# =========================
# DEPLOY TO STAGING
# =========================
- stage: DeployStaging
  displayName: 'Deploy to Staging'
  dependsOn: Build
  jobs:
    - job: DeployJob
      displayName: 'Deploy to Staging Slot'
      pool:
        name: 'pool'
      steps:

        - task: DownloadBuildArtifacts@0
          displayName: 'Download artifact'
          inputs:
            buildType: 'current'
            downloadType: 'single'
            artifactName: 'WebApplicationDDD'
            downloadPath: '$(System.ArtifactsDirectory)'

        - task: AzureWebApp@1
          displayName: 'Deploy to Staging Slot'
          inputs:
            azureSubscription: 'Azure Connect'
            appName: 'WebApplicationDDD'
            slotName: 'staging'
            package: '$(System.ArtifactsDirectory)/WebApplicationDDD/**/*.zip'

        # 🔐 Configure STAGING (immediate)
        - task: AzureCLI@2
          displayName: 'Configure Staging Key Vault Connection'
          inputs:
            azureSubscription: 'Azure Connect'
            scriptType: 'bash'
            scriptLocation: 'inlineScript'
            inlineScript: |
              az webapp config appsettings set \
                --name WebApplicationDDD \
                --resource-group sakethresoursegroup \
                --slot staging \
                --settings \
                  ConnectionStrings__DefaultConnection="@Microsoft.KeyVault(SecretUri=https://$(keyVaultName).vault.azure.net/secrets/Constr)" \
                  ASPNETCORE_ENVIRONMENT="Staging" \
                --slot-settings ConnectionStrings__Constr


# =========================
# SWAP TO PRODUCTION
# =========================
- stage: SwapProduction
  displayName: 'Swap to Production'
  dependsOn: DeployStaging
  jobs:
    - deployment: SwapToProduction
      displayName: 'Swap Staging to Production'
      environment: 'production'
      pool:
        name: 'pool'
      strategy:
        runOnce:
          deploy:
            steps:

              # 🔐 Configure PRODUCTION BEFORE SWAP
              - task: AzureCLI@2
                displayName: 'Configure Production Key Vault Connection'
                inputs:
                  azureSubscription: 'Azure Connect'
                  scriptType: 'bash'
                  scriptLocation: 'inlineScript'
                  inlineScript: |
                    az webapp config appsettings set \
                      --name WebApplicationDDD \
                      --resource-group sakethresoursegroup \
                      --settings \
                        ConnectionStrings__DefaultConnection="@Microsoft.KeyVault(SecretUri=https://$(keyVaultName).vault.azure.net/secrets/Constr)" \
                        ASPNETCORE_ENVIRONMENT="Production" \
                      --slot-settings ConnectionStrings__Constr

              # 🔄 Swap
              - task: AzureAppServiceManage@0
                displayName: 'Swap Staging to Production'
                inputs:
                  azureSubscription: 'Azure Connect'
                  WebAppName: 'WebApplicationDDD'
                  ResourceGroupName: 'sakethresoursegroup'
                  Action: 'Swap Slots'
                  SourceSlot: 'staging'
