trigger:
  branches:
    include:
      - main

pool:
  name: 'pool'

variables:
  buildConfiguration: 'Release'
  solution: '**/*.sln'

stages:

  # =========================
  # BUILD STAGE
  # =========================
  - stage: Build
    displayName: 'Build & Test'
    jobs:
      - job: BuildJob
        displayName: 'Build, Test, Publish'
        steps:

          - task: NuGetAuthenticate@1
            displayName: 'Authenticate NuGet'

          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet packages'
            inputs:
              command: 'restore'
              projects: '$(solution)'
              feedsToUse: 'select'

          - task: DotNetCoreCLI@2
            displayName: 'Build WebApp.Domain'
            inputs:
              command: 'build'
              projects: '**/WebApp.Domain/*.csproj'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Build WebApp.Application'
            inputs:
              command: 'build'
              projects: '**/WebApp.Application/*.csproj'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Build WebApp.Infrastructure'
            inputs:
              command: 'build'
              projects: '**/WebApp.Infrastructure/*.csproj'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Build WebApp.Web'
            inputs:
              command: 'build'
              projects: '**/WebApp.Web/*.csproj'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Publish WebApp.Web'
            inputs:
              command: 'publish'
              projects: '**/WebApp.Web/*.csproj'
              arguments: >-
                --configuration $(buildConfiguration)
                --output $(Build.ArtifactStagingDirectory)
                --no-build
              zipAfterPublish: true

          - task: PublishBuildArtifacts@1
            displayName: 'Upload artifact'
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)'
              artifactName: 'WebApplicationDDD'


  # =========================
  # DEPLOY STAGE (FIXED POSITION)
  # =========================
  - stage: Deploy
    displayName: 'Deploy to Azure'
    dependsOn: Build

    jobs:

      # =========================
      # DEPLOY TO STAGING
      # =========================
      - deployment: DeployToStaging
        displayName: 'Deploy to Staging'
        environment: 'staging'
        pool:
          name: 'pool'

        strategy:
          runOnce:
            deploy:
              steps:

                - task: DownloadBuildArtifacts@0
                  displayName: 'Download Build Artifact'
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'WebApplicationDDD'
                    downloadPath: '$(System.ArtifactsDirectory)'

                - task: AzureWebApp@1
                  displayName: 'Deploy to Staging Slot'
                  inputs:
                    azureSubscription: 'Azure Connect'
                    appName: 'WebApplicationDDD'
                    slotName: 'staging'
                    package: '$(System.ArtifactsDirectory)/WebApplicationDDD/**/*.zip'


      # =========================
      # APPROVAL + SWAP
      # =========================
      - deployment: SwapToProduction
        displayName: 'Swap to Production'
        dependsOn: DeployToStaging
        environment: 'Production'
        pool:
          name: 'pool'

        strategy:
          runOnce:
            deploy:
              steps:

                - task: AzureAppServiceManage@0
                  displayName: 'Swap Staging to Production'
                  inputs:
                    azureSubscription: 'Azure Connect'
                    WebAppName: 'WebApplicationDDD'
                    ResourceGroupName: 'sakethresoursegroup'
                    Action: 'Swap Slots'
                    SourceSlot: 'staging'
