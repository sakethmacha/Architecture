trigger:
  branches:
    include:
      - main

pool:
  name: 'pool'

variables:
  # Docker/ACR variables
  - name: dockerRegistryServiceConnection
    value: 'sakethacr-connection'
  - name: imageRepository
    value: 'webappddd'
  - name: containerRegistry
    value: 'sakethacr.azurecr.io'
  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/Dockerfile'
  - name: tag
    value: '$(Build.BuildNumber)'

  # App Service variables
  - name: regularAppName
    value: 'WebApplicationDDD'
  - name: containerAppName
    value: 'webappddd-app'
  - name: azureServiceConnection
    value: 'Azure Connect'
  - name: resourceGroup
    value: 'sakethresoursegroup'
  - name: artifactName
    value: 'WebApplicationDDD'
  - name: buildConfiguration
    value: 'Release'
  - name: solution
    value: '**/*.sln'

  # KeyVault connection string reference
  - name: connectionString
    value: '@Microsoft.KeyVault(SecretUri=https://keyvault1232123.vault.azure.net/secrets/Constr/)'


# ══════════════════════════════════════════════════════════════════════════
# STAGE 1: BUILD (Shared by both deployments)
# ══════════════════════════════════════════════════════════════════════════
stages:
- stage: Build
  displayName: 'Build & Publish'
  jobs:
    - job: BuildJob
      displayName: 'Build, Publish & Push to ACR'
      steps:

        - task: NuGetAuthenticate@1
          displayName: 'Authenticate NuGet'

        - task: DotNetCoreCLI@2
          displayName: 'Restore NuGet packages'
          inputs:
            command: 'restore'
            projects: '$(solution)'
            feedsToUse: 'select'

        - task: DotNetCoreCLI@2
          displayName: 'Build WebApp.Domain'
          inputs:
            command: 'build'
            projects: '**/WebApp.Domain/*.csproj'
            arguments: '--configuration $(buildConfiguration) --no-restore'

        - task: DotNetCoreCLI@2
          displayName: 'Build WebApp.Application'
          inputs:
            command: 'build'
            projects: '**/WebApp.Application/*.csproj'
            arguments: '--configuration $(buildConfiguration) --no-restore'

        - task: DotNetCoreCLI@2
          displayName: 'Build WebApp.Infrastructure'
          inputs:
            command: 'build'
            projects: '**/WebApp.Infrastructure/*.csproj'
            arguments: '--configuration $(buildConfiguration) --no-restore'

        - task: DotNetCoreCLI@2
          displayName: 'Build WebApp.Web'
          inputs:
            command: 'build'
            projects: '**/WebApp.Web/*.csproj'
            arguments: '--configuration $(buildConfiguration) --no-restore'

        - task: DotNetCoreCLI@2
          displayName: 'Publish WebApp.Web'
          inputs:
            command: 'publish'
            projects: '**/WebApp.Web/*.csproj'
            arguments: >-
              --configuration $(buildConfiguration)
              --output $(Build.ArtifactStagingDirectory)
              --no-build
            zipAfterPublish: true

        - task: PublishBuildArtifacts@1
          displayName: 'Upload artifact'
          inputs:
            pathToPublish: '$(Build.ArtifactStagingDirectory)'
            artifactName: '$(artifactName)'

        - script: |
            echo "Build completed successfully!"
            echo "Artifact: $(artifactName)"
          displayName: 'Build summary'


# ══════════════════════════════════════════════════════════════════════════
# DEPLOYMENT PATH 1: REGULAR APP 
# ══════════════════════════════════════════════════════════════════════════
- stage: DeployRegularStaging
  displayName: 'Deploy Zip to WebApplicationDDD Staging'
  dependsOn: Build
  condition: succeeded()
  jobs:
    - job: DeployRegularStagingJob
      displayName: 'Deploy Zip to Staging Slot'
      steps:

        - task: DownloadBuildArtifacts@1
          displayName: 'Download artifact'
          inputs:
            buildType: 'current'
            downloadType: 'single'
            artifactName: '$(artifactName)'
            downloadPath: '$(System.ArtifactsDirectory)'

        - task: AzureWebApp@1
          displayName: 'Deploy Zip to Regular App Staging slot'
          inputs:
            azureSubscription: '$(azureServiceConnection)'
            appType: 'webApp'
            appName: '$(regularAppName)'
            deployToSlotOrASE: true
            resourceGroupName: '$(resourceGroup)'
            slotName: 'staging'
            package: '$(System.ArtifactsDirectory)/$(artifactName)/**/*.zip'
            deploymentMethod: 'auto'
            appSettings: '-ASPNETCORE_ENVIRONMENT Staging'
            connectionStrings: '-Constr "$(connectionString)" SQLAzure'

        - script: |
            echo "✅ WebApplicationDDD deployed to Staging!"
            echo "URL: https://$(regularAppName)-staging.azurewebsites.net"
          displayName: 'Regular app staging summary'


- stage: SwapRegularProduction
  displayName: 'Swap WebApplicationDDD to Production'
  dependsOn: DeployRegularStaging
  condition: succeeded()
  jobs:
    - deployment: SwapRegularJob
      displayName: 'Swap Regular App Staging to Production'
      environment: 'production'
      strategy:
        runOnce:
          deploy:
            steps:

              - task: AzureAppServiceSettings@1
                displayName: 'Set Production App Settings'
                inputs:
                  azureSubscription: '$(azureServiceConnection)'
                  appName: '$(regularAppName)'
                  resourceGroupName: '$(resourceGroup)'
                  continueOnError: true
                  appSettings: |
                    [
                      {
                        "name": "ASPNETCORE_ENVIRONMENT",
                        "value": "Production",
                        "slotSetting": true
                      }
                    ]
                  connectionStrings: |
                    [
                      {
                        "name": "Constr",
                        "value": "$(connectionString)",
                        "type": "SQLAzure",
                        "slotSetting": true
                      }
                    ]

              - task: AzureAppServiceManage@0
                displayName: 'Swap Regular App Staging to Production'
                inputs:
                  azureSubscription: '$(azureServiceConnection)'
                  action: 'Swap Slots'
                  webAppName: '$(regularAppName)'
                  resourceGroupName: '$(resourceGroup)'
                  sourceSlot: 'staging'
                  swapWithProduction: true

              - script: |
                  echo "✅ WebApplicationDDD swapped to Production!"
                  echo "URL: https://$(regularAppName).azurewebsites.net"
                displayName: 'Regular app production summary'


# ══════════════════════════════════════════════════════════════════════════
# DEPLOYMENT PATH 2: DOCKER (Build & Push to ACR)
# ══════════════════════════════════════════════════════════════════════════
- stage: Docker
  displayName: 'Build & Push Docker Image to ACR'
  dependsOn: Build
  condition: succeeded()
  jobs:
    - job: DockerBuild
      displayName: 'Docker Build and Push'
      steps:

        - task: Docker@2
          displayName: 'Build Docker Image'
          inputs:
            command: 'build'
            repository: '$(imageRepository)'
            dockerfile: '$(dockerfilePath)'
            containerRegistry: '$(dockerRegistryServiceConnection)'
            tags: |
              $(tag)
              latest

        - task: Docker@2
          displayName: 'Push Docker Image to ACR'
          inputs:
            command: 'push'
            repository: '$(imageRepository)'
            containerRegistry: '$(dockerRegistryServiceConnection)'
            tags: |
              $(tag)
              latest

        - script: |
            echo "✅ Docker image pushed to ACR!"
            echo "Image: $(containerRegistry)/$(imageRepository):$(tag)"
          displayName: 'Docker build summary'


# ══════════════════════════════════════════════════════════════════════════
# DEPLOYMENT PATH 2: CONTAINER APP (Deploy to Staging)
# ══════════════════════════════════════════════════════════════════════════
- stage: DeployContainerStaging
  displayName: 'Deploy Container to webappddd-app Staging'
  dependsOn: Docker
  condition: succeeded()
  jobs:
    - job: DeployContainerStagingJob
      displayName: 'Deploy Container to Staging Slot'
      steps:

        - task: AzureWebAppContainer@1
          displayName: 'Deploy Container to Staging Slot'
          inputs:
            azureSubscription: '$(azureServiceConnection)'
            appName: '$(containerAppName)'
            deployToSlotOrASE: true
            resourceGroupName: '$(resourceGroup)'
            slotName: 'staging'
            containers: '$(containerRegistry)/$(imageRepository):$(tag)'

        - task: AzureAppServiceSettings@1
          displayName: 'Configure Container Staging Settings'
          inputs:
            azureSubscription: '$(azureServiceConnection)'
            appName: '$(containerAppName)'
            resourceGroupName: '$(resourceGroup)'
            slotName: 'staging'
            continueOnError: true
            appSettings: |
              [
                {
                  "name": "ASPNETCORE_ENVIRONMENT",
                  "value": "Staging",
                  "slotSetting": true
                },
                {
                  "name": "WEBSITES_PORT",
                  "value": "8080",
                  "slotSetting": false
                }
              ]
            connectionStrings: |
              [
                {
                  "name": "Constr",
                  "value": "$(connectionString)",
                  "type": "SQLAzure",
                  "slotSetting": true
                }
              ]

        - script: |
            echo "✅ Container deployed to Staging!"
            echo "Staging URL: https://$(containerAppName)-staging.azurewebsites.net"
          displayName: 'Container staging summary'


# ══════════════════════════════════════════════════════════════════════════
# DEPLOYMENT PATH 2: CONTAINER APP (Swap to Production)
# ══════════════════════════════════════════════════════════════════════════
- stage: SwapContainerProduction
  displayName: 'Swap webappddd-app to Production'
  dependsOn: DeployContainerStaging
  condition: succeeded()
  jobs:
    - deployment: SwapContainerJob
      displayName: 'Swap Container App Staging to Production'
      environment: 'production'
      strategy:
        runOnce:
          deploy:
            steps:

              - task: AzureAppServiceSettings@1
                displayName: 'Set Container Production Settings'
                inputs:
                  azureSubscription: '$(azureServiceConnection)'
                  appName: '$(containerAppName)'
                  resourceGroupName: '$(resourceGroup)'
                  continueOnError: true
                  appSettings: |
                    [
                      {
                        "name": "ASPNETCORE_ENVIRONMENT",
                        "value": "Production",
                        "slotSetting": true
                      },
                      {
                        "name": "WEBSITES_PORT",
                        "value": "8080",
                        "slotSetting": false
                      }
                    ]
                  connectionStrings: |
                    [
                      {
                        "name": "Constr",
                        "value": "$(connectionString)",
                        "type": "SQLAzure",
                        "slotSetting": true
                      }
                    ]

              - task: AzureAppServiceManage@0
                displayName: 'Swap Container App Staging to Production'
                inputs:
                  azureSubscription: '$(azureServiceConnection)'
                  action: 'Swap Slots'
                  webAppName: '$(containerAppName)'
                  resourceGroupName: '$(resourceGroup)'
                  sourceSlot: 'staging'
                  swapWithProduction: true

              - script: |
                  echo "✅ Container App swapped to Production!"
                  echo "Production URL: https://$(containerAppName).azurewebsites.net"
                displayName: 'Container production summary'