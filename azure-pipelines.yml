trigger:
  branches:
    include:
      - main

pool:
  name: 'pool'

variables:
  buildConfiguration: 'Release'
  solution: '**/*.sln'
  keyVaultName: 'keyvault1232123'
  azureSubscription: 'Azure Connect'
  webAppName: 'sakethwebapp'
  resourceGroup: 'sakethresoursegroup'
  acrName: 'sakethacr'
  acrLoginServer: 'sakethacr.azurecr.io'
  imageRepository: 'webappddd'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  imageTag: '$(Build.BuildId)'
  acrServiceConnection: 'ACRServiceConnection'

stages:

# =========================
# BUILD STAGE
# =========================
- stage: Build
  displayName: 'Build, Test & Docker Push'
  jobs:
  - job: BuildJob
    displayName: 'Build, Publish & Push to ACR'
    steps:

    - task: NuGetAuthenticate@1
      displayName: 'Authenticate NuGet'

    - task: DotNetCoreCLI@2
      displayName: 'Restore NuGet packages'
      inputs:
        command: 'restore'
        projects: '$(solution)'
        feedsToUse: 'select'

    - task: DotNetCoreCLI@2
      displayName: 'Build WebApp.Domain'
      inputs:
        command: 'build'
        projects: '**/WebApp.Domain/*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Build WebApp.Application'
      inputs:
        command: 'build'
        projects: '**/WebApp.Application/*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Build WebApp.Infrastructure'
      inputs:
        command: 'build'
        projects: '**/WebApp.Infrastructure/*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Build WebApp.Web'
      inputs:
        command: 'build'
        projects: '**/WebApp.Web/*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: Docker@2
      displayName: 'Login to ACR'
      inputs:
        command: login
        containerRegistry: '$(acrServiceConnection)'

    - task: Docker@2
      displayName: 'Build Docker Image'
      inputs:
        command: build
        repository: '$(imageRepository)'
        dockerfile: '$(dockerfilePath)'
        containerRegistry: '$(acrServiceConnection)'
        tags: |
          $(imageTag)
          latest

    - task: Docker@2
      displayName: 'Push Docker Image to ACR'
      inputs:
        command: push
        repository: '$(imageRepository)'
        containerRegistry: '$(acrServiceConnection)'
        tags: |
          $(imageTag)
          latest

    - script: echo "##vso[task.setvariable variable=imageTag;isOutput=true]$(imageTag)"
      name: exportTag
      displayName: 'Export Image Tag to next stages'


# =========================
# DEPLOY TO STAGING
# =========================
- stage: DeployStaging
  displayName: 'Deploy Container to Staging'
  dependsOn: Build
  variables:
    imageTagFromBuild: $[ stageDependencies.Build.BuildJob.outputs['exportTag.imageTag'] ]
  jobs:
  - job: DeployJob
    displayName: 'Deploy Container to Staging Slot'
    pool:
      name: 'pool'
    steps:

    - task: AzureWebAppContainer@1
      displayName: 'Deploy Container to Staging Slot'
      inputs:
        azureSubscription: '$(azureSubscription)'
        appName: '$(webAppName)'
        slotName: 'staging'
        imageName: '$(acrLoginServer)/$(imageRepository):$(imageTagFromBuild)'

    - task: AzureAppServiceSettings@1
      displayName: 'Configure Staging Settings'
      inputs:
        azureSubscription: '$(azureSubscription)'
        appName: '$(webAppName)'
        resourceGroupName: '$(resourceGroup)'
        slotName: 'staging'
        appSettings: |
          [
            {
              "name": "ASPNETCORE_ENVIRONMENT",
              "value": "Staging",
              "slotSetting": true
            },
            {
              "name": "WEBSITES_PORT",
              "value": "8080",
              "slotSetting": false
            }
          ]
        connectionStrings: |
          [
            {
              "name": "Constr",
              "value": "@Microsoft.KeyVault(SecretUri=https://$(keyVaultName).vault.azure.net/secrets/Constr/)",
              "type": "SQLAzure",
              "slotSetting": true
            }
          ]


# =========================
# SWAP TO PRODUCTION
# =========================
- stage: SwapProduction
  displayName: 'Swap to Production'
  dependsOn: DeployStaging
  jobs:
  - deployment: SwapToProduction
    displayName: 'Swap Staging to Production'
    environment: 'production'
    pool:
      name: 'pool'
    strategy:
      runOnce:
        deploy:
          steps:

          - task: AzureAppServiceSettings@1
            displayName: 'Configure Production Settings'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appName: '$(webAppName)'
              resourceGroupName: '$(resourceGroup)'
              appSettings: |
                [
                  {
                    "name": "ASPNETCORE_ENVIRONMENT",
                    "value": "Production",
                    "slotSetting": true
                  },
                  {
                    "name": "WEBSITES_PORT",
                    "value": "8080",
                    "slotSetting": false
                  }
                ]
              connectionStrings: |
                [
                  {
                    "name": "Constr",
                    "value": "@Microsoft.KeyVault(SecretUri=https://$(keyVaultName).vault.azure.net/secrets/Constr/)",
                    "type": "SQLAzure",
                    "slotSetting": true
                  }
                ]

          - task: AzureAppServiceManage@0
            displayName: 'Swap Staging to Production'
            inputs:
              azureSubscription: '$(azureSubscription)'
              WebAppName: '$(webAppName)'
              ResourceGroupName: '$(resourceGroup)'
              Action: 'Swap Slots'
              SourceSlot: 'staging'