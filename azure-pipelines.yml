trigger:
  branches:
    include:
      - main

pool:
  name: 'pool'

variables:
  buildConfiguration: 'Release'
  solution: '**/*.sln'

stages:

  - stage: Build
    displayName: 'Build & Test'
    jobs:
      - job: BuildJob
        displayName: 'Build, Test, Publish'
        steps:

          # 1. Authenticate NuGet (needed for self-hosted agents)
          - task: NuGetAuthenticate@1
            displayName: 'Authenticate NuGet'

          # 2. Restore NuGet packages for all projects
          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet packages'
            inputs:
              command: 'restore'
              projects: '$(solution)'
              feedsToUse: 'select'

          # 3. Build Domain
          - task: DotNetCoreCLI@2
            displayName: 'Build WebApp.Domain'
            inputs:
              command: 'build'
              projects: '**/WebApp.Domain/*.csproj'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          # 4. Build Application
          - task: DotNetCoreCLI@2
            displayName: 'Build WebApp.Application'
            inputs:
              command: 'build'
              projects: '**/WebApp.Application/*.csproj'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          # 5. Build Infrastructure
          - task: DotNetCoreCLI@2
            displayName: 'Build WebApp.Infrastructure'
            inputs:
              command: 'build'
              projects: '**/WebApp.Infrastructure/*.csproj'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          # 6. Build Web
          - task: DotNetCoreCLI@2
            displayName: 'Build WebApp.Web'
            inputs:
              command: 'build'
              projects: '**/WebApp.Web/*.csproj'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          # 7. Publish the web app
          - task: DotNetCoreCLI@2
            displayName: 'Publish WebApp.Web'
            inputs:
              command: 'publish'
              projects: '**/WebApp.Web/*.csproj'
              arguments: >-
                --configuration $(buildConfiguration)
                --output $(Build.ArtifactStagingDirectory)
                --no-build
              zipAfterPublish: true

          # 8. Upload artifact
          - task: PublishBuildArtifacts@1
            displayName: 'Upload artifact'
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)'
              artifactName: 'WebApplicationDDD'


  # ========================
  # 🚀 DEPLOY STAGE (CD)
  # ========================

  # - stage: Deploy
  #   displayName: 'Deploy to Azure'
  #   dependsOn: Build

  #   jobs:
  #     - job: DeployJob
  #       displayName: 'Deploy Web App'
  #       pool:
  #         name: 'pool'

  #       steps:

  #         # 1. Download artifact
  #         - task: DownloadBuildArtifacts@0
  #           displayName: 'Download Build Artifact'
  #           inputs:
  #             buildType: 'current'
  #             downloadType: 'single'
  #             artifactName: 'WebApplicationDDD'
  #             downloadPath: '$(System.ArtifactsDirectory)'

  #         # 2. Deploy to Azure App Service
  #         - task: AzureWebApp@1
  #           displayName: 'Deploy to Azure App Service'
  #           inputs:
  #             azureSubscription: 'Azure Connect'   
  #             appName: 'WebApplicationDDD'
  #             slotName: 'staging'            
  #             package: '$(System.ArtifactsDirectory)/WebApplicationDDD/**/*.zip'

  #         # 3. Swap staging to Production
  #         - task: AzureAppServiceManage@0
  #           displayName: 'Swap Staging to Production'
  #           inputs:
  #             azureSubscription: 'Azure Connect'
  #             WebAppName: 'WebApplicationDDD'
  #             ResourceGroupName: 'sakethresoursegroup'
  #             Action: 'Swap Slots'
  #             SourceSlot: 'staging'
  - stage: Deploy
    displayName: 'Deploy to Azure'
    dependsOn: Build

    jobs:

      # =========================
      # 1. DEPLOY TO STAGING
      # =========================
      - deployment: DeployToStaging
        displayName: 'Deploy to Staging'
        environment: 'staging'   # no approval here
        pool:
          name: 'pool'

        strategy:
          runOnce:
            deploy:
              steps:

                # Download artifact
                - task: DownloadBuildArtifacts@0
                  displayName: 'Download Build Artifact'
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'WebApplicationDDD'
                    downloadPath: '$(System.ArtifactsDirectory)'

                # Deploy to staging slot
                - task: AzureWebApp@1
                  displayName: 'Deploy to Staging Slot'
                  inputs:
                    azureSubscription: 'Azure Connect'
                    appName: 'WebApplicationDDD'
                    slotName: 'staging'
                    package: '$(System.ArtifactsDirectory)/WebApplicationDDD/**/*.zip'


      # =========================
      # 2. APPROVAL + SWAP
      # =========================
      - deployment: SwapToProduction
        displayName: 'Swap to Production'
        dependsOn: DeployToStaging
        environment: 'Production'   # 🔴 approval happens here
        pool:
          name: 'pool'

        strategy:
          runOnce:
            deploy:
              steps:

                # Swap slots
                - task: AzureAppServiceManage@0
                  displayName: 'Swap Staging to Production'
                  inputs:
                    azureSubscription: 'Azure Connect'
                    WebAppName: 'WebApplicationDDD'
                    ResourceGroupName: 'sakethresoursegroup'
                    Action: 'Swap Slots'
                    SourceSlot: 'staging'


